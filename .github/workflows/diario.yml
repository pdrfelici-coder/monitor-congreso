# Corre el monitor todos los días, guarda el histórico en el repo y publica el informe en GitHub Pages.
name: Monitor diario

on:
  # GitHub no garantiza el horario de las corridas programadas: con carga las demora horas o
  # directamente no las lanza (pasó el 12 y el 13/10/2026). Por eso hay varios intentos en
  # minutos poco usados (no en punto ni y media). El primero que arranca genera el informe del
  # día; los demás ven que ya existe y no hacen nada. Horarios en UTC (Argentina = UTC-3).
  schedule:
    - cron: "7 8 * * *"    # 05:07 ART
    - cron: "41 8 * * *"   # 05:41 ART
    - cron: "13 9 * * *"   # 06:13 ART
    - cron: "47 9 * * *"   # 06:47 ART
    - cron: "19 10 * * *"  # 07:19 ART (respaldo)
    - cron: "11 12 * * *"  # 09:11 ART (último respaldo)
  workflow_dispatch: {}  # botón "Run workflow" para correrlo a mano

permissions:
  contents: write  # para commitear datos/ e informes/
  pages: write
  id-token: write

concurrency:
  group: monitor-diario
  cancel-in-progress: false

jobs:
  # ¿Ya hay informe de hoy? Si una corrida programada llega tarde y ya está hecho, no repite.
  # A mano (Run workflow) siempre corre, para poder regenerarlo.
  chequeo:
    runs-on: ubuntu-latest
    outputs:
      hecho: ${{ steps.ver.outputs.hecho }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: informes
      - id: ver
        run: |
          hoy=$(TZ=America/Argentina/Buenos_Aires date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "informes/$hoy.html" ]; then
            echo "El informe de $hoy ya existe: no se vuelve a correr."
            echo "hecho=true" >> "$GITHUB_OUTPUT"
          else
            echo "hecho=false" >> "$GITHUB_OUTPUT"
          fi

  correr:
    needs: chequeo
    if: needs.chequeo.outputs.hecho != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el monitor
        env:
          TZ: America/Argentina/Buenos_Aires
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}  # opcional; sin él, el módulo de X se saltea
        run: python run.py

      - name: Guardar histórico en el repo
        run: |
          git config user.name "monitor-congreso[bot]"
          git config user.email "monitor-congreso@users.noreply.github.com"
          git add datos informes
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar"
          else
            git commit -m "Informe $(TZ=America/Argentina/Buenos_Aires date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: informes
      - id: deploy
        uses: actions/deploy-pages@v4
