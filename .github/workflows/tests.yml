# Corre los tests cada vez que se sube un cambio (por ejemplo, al editar keywords.yaml).
name: Tests

on:
  push:
    paths-ignore: ["datos/**", "informes/**"]
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
